basePath: /
definitions:
  handlers.ChargeBatchEntry:
    properties:
      batch_id:
        type: string
      billing_account_id:
        type: string
      billing_provider_report:
        $ref: '#/definitions/handlers.chargeBatchReportEntry'
      cloud_provider_report:
        $ref: '#/definitions/handlers.chargeBatchReportEntry'
      cloud_service_provider_id:
        type: string
      status:
        type: string
    type: object
  handlers.CloudProviderLink:
    properties:
      billing_account_id:
        type: string
      billing_currency:
        type: string
      cloud_provider_account_id:
        type: string
      cloud_provider_id:
        type: string
      cloud_provider_name:
        type: string
      id:
        type: string
      total_cost:
        type: number
    type: object
  handlers.InvoiceEntry:
    properties:
      amount:
        type: number
      billing_period_id:
        type: string
      currency:
        type: string
      due_at:
        type: string
      id:
        type: string
      issued_at:
        type: string
      provider_line_items:
        items:
          $ref: '#/definitions/handlers.InvoiceProviderLineItemEntry'
        type: array
      status:
        type: string
    type: object
  handlers.InvoiceProviderLineItemEntry:
    properties:
      amount:
        type: number
      batch_count:
        type: integer
      cloud_service_provider_id:
        type: string
      merkle_root:
        type: string
    type: object
  handlers.RegisterAcccountRequest:
    properties:
      account_alias:
        type: string
      billing_provider_base_url:
        type: string
      return_url:
        description: 'TODO: I''m not sure I like the frontend setting the URL... Might
          need to change this...'
        type: string
    required:
    - account_alias
    - billing_provider_base_url
    - return_url
    type: object
  handlers.RegisterAccountResponse:
    properties:
      account_id:
        type: string
      redirect_url:
        type: string
    type: object
  handlers.RegisterLinkedCloudProviderRequest:
    properties:
      account_id:
        description: The billing account ID to link the cloud provider to
        type: string
      cloud_provider_id:
        description: The identifier from the billing provider metadata
        type: string
      return_url:
        type: string
    required:
    - account_id
    - cloud_provider_id
    - return_url
    type: object
  handlers.ResourceChargeEntry:
    properties:
      billing_currency:
        type: string
      cloud_service_provider_id:
        type: string
      line_item_count:
        type: integer
      resource_id:
        type: string
      resource_name:
        type: string
      resource_type:
        type: string
      service_category:
        type: string
      service_name:
        type: string
      total_billed_cost:
        type: number
    type: object
  handlers.billingAccountDetailResponse:
    properties:
      alias:
        type: string
      billing_provider_id:
        type: string
      billing_provider_name:
        type: string
      id:
        type: string
      supported_cloud_providers:
        items:
          $ref: '#/definitions/handlers.supportedCloudProviderEntry'
        type: array
    type: object
  handlers.billingAccountResponse:
    properties:
      alias:
        type: string
      billing_provider_id:
        type: string
      billing_provider_name:
        type: string
      id:
        type: string
    type: object
  handlers.chargeBatchReportEntry:
    properties:
      batch_signature:
        type: string
      billed_currency:
        type: string
      created_at:
        type: string
      merkle_root:
        type: string
      received_at:
        type: string
      total_cost:
        type: number
      total_items:
        type: integer
    type: object
  handlers.completeCloudProviderOnboardingRequest:
    properties:
      csp_provider_id:
        type: string
    required:
    - csp_provider_id
    type: object
  handlers.supportedCloudProviderEntry:
    properties:
      customer_api_endpoint_url:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
host: localhost:8082
info:
  contact:
    name: Andrew Rutherfoord
  description: Mock Cloud Service Provider billing API implementing the FOCUS spec.
  title: CSP Mock API
  version: "1.0"
paths:
  /billing/accounts:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handlers.billingAccountResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get all billing accounts
      tags:
      - billing
  /billing/accounts/{id}:
    get:
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.billingAccountDetailResponse'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get a billing account by ID
      tags:
      - billing
  /billing/accounts/{id}/charge-batches:
    get:
      description: Each charge batch is returned once, with the billing provider's
        report and the cloud service provider's own report of the same batch ID side
        by side (either may be missing), plus a status indicating whether they agree.
      parameters:
      - description: Billing account ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handlers.ChargeBatchEntry'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List charge batches for a billing account, merging the billing provider's
        and cloud provider's reports
      tags:
      - billing
  /billing/accounts/{id}/cloud-provider-accounts:
    get:
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handlers.CloudProviderLink'
            type: array
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List cloud providers linked to a billing account
      tags:
      - billing
  /billing/accounts/{id}/cloud-provider-accounts/complete:
    post:
      consumes:
      - application/json
      description: Called by the frontend after the CSP redirect. Stores the CSP account
        link in the billing account.
      parameters:
      - description: Billing account ID
        in: path
        name: id
        required: true
        type: string
      - description: Request body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.completeCloudProviderOnboardingRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.CloudProviderLink'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Complete cloud provider account onboarding
      tags:
      - billing
  /billing/accounts/{id}/cloud-provider-accounts/register:
    post:
      consumes:
      - application/json
      description: Registers a new cloud provider account with the billing provider
        and returns a redirect URL for the customer onboarding flow.
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        type: string
      - description: Request body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.RegisterLinkedCloudProviderRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.RegisterAccountResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register a cloud provider account with a billing account
      tags:
      - billing
  /billing/accounts/{id}/invoices:
    get:
      description: Lists invoices synced locally from the billing account's billing
        provider.
      parameters:
      - description: Billing account ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handlers.InvoiceEntry'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List invoices for a billing account
      tags:
      - billing
  /billing/accounts/{id}/resource-charges:
    get:
      description: Aggregates billed cost per resource entirely from the FOCUS line
        items fetched directly from the CSP (not from anything reported by the billing
        provider), so each row also shows which cloud service provider it came from.
      parameters:
      - description: Billing account ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handlers.ResourceChargeEntry'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List aggregated billed cost per resource
      tags:
      - billing
  /billing/accounts/register:
    post:
      consumes:
      - application/json
      description: Registers a new billing account with a billing provider and returns
        a redirect URL for the customer onboarding flow.
      parameters:
      - description: Request body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.RegisterAcccountRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.RegisterAccountResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register billing account with billing provider
      tags:
      - billing
  /health:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Health check
      tags:
      - health
securityDefinitions:
  BearerAuth:
    description: Bearer <account_id>
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
