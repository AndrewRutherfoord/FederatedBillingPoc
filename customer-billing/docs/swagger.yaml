basePath: /
definitions:
  handlers.CloudProviderLink:
    properties:
      billing_provider_id:
        type: string
      billing_provider_name:
        type: string
      cloud_provider_id:
        type: string
      cloud_provider_name:
        type: string
      id:
        type: string
    required:
    - billing_provider_id
    - billing_provider_name
    - cloud_provider_id
    - cloud_provider_name
    - id
    type: object
  handlers.RegisterAcccountRequest:
    properties:
      account_alias:
        type: string
      billing_provider_base_url:
        type: string
      return_url:
        type: string
    required:
    - account_alias
    - billing_provider_base_url
    - return_url
    type: object
  handlers.RegisterAccountResponse:
    properties:
      account_id:
        type: string
      redirect_url:
        type: string
    type: object
  handlers.billingAccountDetailResponse:
    properties:
      alias:
        type: string
      billing_provider_id:
        type: string
      billing_provider_name:
        type: string
      id:
        type: string
      supported_cloud_providers:
        items:
          $ref: '#/definitions/handlers.supportedCloudProviderEntry'
        type: array
    type: object
  handlers.billingAccountResponse:
    properties:
      alias:
        type: string
      billing_provider_id:
        type: string
      billing_provider_name:
        type: string
      id:
        type: string
    type: object
  handlers.supportedCloudProviderEntry:
    properties:
      api_endpoint_url:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
host: localhost:8082
info:
  contact:
    name: Andrew Rutherfoord
  description: Mock Cloud Service Provider billing API implementing the FOCUS spec.
  title: CSP Mock API
  version: "1.0"
paths:
  /billing/accounts:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              items:
                $ref: '#/definitions/handlers.billingAccountResponse'
              type: array
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get all billing accounts
      tags:
      - billing
  /billing/accounts/{id}:
    get:
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.billingAccountDetailResponse'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get a billing account by ID
      tags:
      - billing
  /billing/accounts/{id}/cloud-provider-links:
    get:
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              items:
                $ref: '#/definitions/handlers.CloudProviderLink'
              type: array
            type: array
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List cloud providers linked to a billing account
      tags:
      - billing
  /billing/accounts/register:
    post:
      consumes:
      - application/json
      description: Registers a new billing account with a billing provider and returns
        a redirect URL for the customer onboarding flow.
      parameters:
      - description: Request body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.RegisterAcccountRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.RegisterAccountResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register billing account with billing provider
      tags:
      - billing
  /health:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Health check
      tags:
      - health
securityDefinitions:
  BearerAuth:
    description: Bearer <account_id>
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
