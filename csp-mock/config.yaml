# Mock CSP — Resource Registry & Pricing Catalogue
# FOCUS 1.3 ServiceCategory / ServiceSubcategory taxonomy throughout.
# Prices are illustrative (EUR).

provider_id: "mock-csp-1"
provider_name: "MockCloud EU-West"
currency: "EUR"
region_id: "eu-west-1"
region_name: "EU West (Amsterdam)"
availability_zone: "eu-west-1a"

resource_types:

  - id: "compute.vm.small"
    display_name: "Virtual Machine — Small"
    description: "General-purpose VM. 2 vCPU, 4 GB RAM."
    service_name: "Compute"
    service_category: "Compute"
    service_subcategory: "Virtual Machines"
    sku_id: "MC-VM-S"
    billing_unit: "Hours"
    pricing:
      model: "per_hour"
      unit_price: 0.042
    config_schema:
      vcpus: 2
      ram_gb: 4
    tags:
      family: "general-purpose"

  - id: "storage.object.standard"
    display_name: "Object Storage — Standard"
    description: "S3-compatible object storage. Billed per GB stored per hour."
    service_name: "Object Storage"
    service_category: "Storage"
    service_subcategory: "Object Storage"
    sku_id: "MC-OBJ-STD"
    billing_unit: "GB-Hours"
    pricing:
      model: "per_gb_hour"
      unit_price: 0.0000275       # ≈ EUR 0.020 / GB-month
    config_schema:
      storage_class: "standard"
    tags:
      family: "object-storage"

  - id: "database.relational.small"
    display_name: "Managed Relational DB — Small"
    description: "Fully managed PostgreSQL-compatible DB. 2 vCPU, 8 GB RAM, 100 GB SSD."
    service_name: "Managed Database"
    service_category: "Databases"
    service_subcategory: "Relational Databases"
    sku_id: "MC-RDB-S"
    billing_unit: "Hours"
    pricing:
      model: "per_hour"
      unit_price: 0.095
    config_schema:
      engine: "postgresql"
      vcpus: 2
      ram_gb: 8
      storage_gb: 100
    tags:
      family: "relational-db"

billing_providers:
  - id: "billing-provider-1"
    name: "Mock Billing Provider"
    api_endpoint: "http://localhost:8081/api/v1/billing"

# ──────────────────────────────────────────────────────────────────
# METERING TICK CONFIG
# CSP-internal config; not part of the FOCUS schema.
# ──────────────────────────────────────────────────────────────────
metering:
  tick_interval_seconds: 60       # wall-clock seconds between metering ticks
  simulated_hours_per_tick: 1     # set > 1 to fast-forward the simulation
