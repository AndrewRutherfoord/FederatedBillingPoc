        type: string
      capacity_reservation_status:
        $ref: '#/definitions/models.CapacityReservationStatus'
      charge_category:
        type: string
      charge_class:
        description: Optional Fields - Charge Details
        type: string
      charge_description:
        type: string
      charge_frequency:
        type: string
      charge_period_end:
        type: string
      charge_period_start:
        type: string
      commitment_discount_category:
