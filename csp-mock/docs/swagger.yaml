basePath: /
definitions:
  cloudserviceprovider.GetBillingAccountRecordsRequest:
    properties:
      billing_account_id:
        type: string
      from:
        type: string
      to:
        type: string
    type: object
  cloudserviceprovider.GetBillingAccountRecordsResponse:
    properties:
      batches:
        items:
          $ref: '#/definitions/models.ChargeBatchDetail'
        type: array
      count:
        type: integer
      from:
        type: string
      to:
        type: string
    type: object
  cloudserviceprovider.Metadata:
    properties:
      api_endpoint_url:
        type: string
      id:
        type: string
      name:
        type: string
      supported_billing_providers:
        items:
          $ref: '#/definitions/cloudserviceprovider.SupportedCloudProviderMetadata'
        type: array
    type: object
  cloudserviceprovider.RegisterLinkedCloudProviderRequest:
    properties:
      billing_account_id:
        type: string
      billing_provider_id:
        type: string
      return_url:
        type: string
    required:
    - billing_account_id
    - billing_provider_id
    - return_url
    type: object
  cloudserviceprovider.RegisterLinkedCloudProviderResponse:
    properties:
      id:
        type: string
      redirect_url:
        type: string
    type: object
  cloudserviceprovider.SupportedCloudProviderMetadata:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  github_com_andrewrutherfoord_fed-bill-poc_csp-mock_internal_config.PricingConfig:
    properties:
      model:
        type: string
      tiers:
        items:
          $ref: '#/definitions/github_com_andrewrutherfoord_fed-bill-poc_csp-mock_internal_config.PricingTier'
        type: array
      unitPrice:
        type: number
    type: object
  github_com_andrewrutherfoord_fed-bill-poc_csp-mock_internal_config.PricingTier:
    properties:
      unitPrice:
        type: number
      upToGB:
        type: integer
    type: object
  github_com_andrewrutherfoord_fed-bill-poc_csp-mock_internal_config.ResourceType:
    properties:
      billingUnit:
        type: string
      configSchema:
        additionalProperties: {}
        type: object
      description:
        type: string
      displayName:
        type: string
      id:
        type: string
      pricing:
        $ref: '#/definitions/github_com_andrewrutherfoord_fed-bill-poc_csp-mock_internal_config.PricingConfig'
      serviceCategory:
        $ref: '#/definitions/models.ServiceCategory'
      serviceName:
        type: string
      serviceSubcategory:
        $ref: '#/definitions/models.ServiceSubcategory'
      skuID:
        type: string
      tags:
        additionalProperties:
          type: string
        type: object
    type: object
  github_com_andrewrutherfoord_fed-bill-poc_csp-mock_internal_db.BillingAccount:
    properties:
      accountID:
        type: string
      billingProviderID:
        type: string
      createdAt:
        type: string
      customerID:
        type: string
      deletedAt:
        $ref: '#/definitions/gorm.DeletedAt'
      updatedAt:
        type: string
    type: object
  github_com_andrewrutherfoord_fed-bill-poc_csp-mock_internal_db.Customer:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  github_com_andrewrutherfoord_fed-bill-poc_csp-mock_internal_db.Resource:
    properties:
      billingAccountID:
        type: string
      customerID:
        type: string
      deletedAt:
        description: Soft delete timestamp
        type: string
      id:
        type: string
      resourceType:
        type: string
      startedAt:
        type: string
      storageGB:
        type: number
    type: object
  gorm.DeletedAt:
    properties:
      time:
        type: string
      valid:
        description: Valid is true if Time is not NULL
        type: boolean
    type: object
  internal_handlers.createBillingAccountRequest:
    properties:
      account_id:
        type: string
      billing_provider:
        type: string
    required:
    - account_id
    - billing_provider
    type: object
  internal_handlers.createResourceRequest:
    properties:
      billing_account_id:
        type: string
      resource_type:
        type: string
    required:
    - billing_account_id
    - resource_type
    type: object
  internal_handlers.registerCustomerRequest:
    properties:
      email:
        type: string
      name:
        type: string
    required:
    - email
    - name
    type: object
  internal_handlers.setStorageRequest:
    properties:
      storage_gb:
        type: number
    required:
    - storage_gb
    type: object
  models.CapacityReservationStatus:
    enum:
    - used
    - unused
    type: string
    x-enum-varnames:
    - CapacityReservationStatusUsed
    - CapacityReservationStatusUnused
  models.ChargeBatchDetail:
    properties:
      batch_id:
