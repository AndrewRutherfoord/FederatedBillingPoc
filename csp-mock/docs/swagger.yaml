host: localhost:8080
info:
  contact:
    name: Andrew Rutherfoord
  description: Mock Cloud Service Provider customer billing API implementing the FOCUS
    spec.
  title: CSP Mock Customer API
  version: "1.0"
paths:
  /.well-known/cloud-service-provider:
    get:
      description: Returns metadata about the cloud service provider, such as provider
        ID and name. This is used by the billing provider or the customer metering
        service to identify and display information about the CSP.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/cloudserviceprovider.Metadata'
      summary: Cloud Service Provider metadata
      tags:
      - well-known
  /billing-accounts:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_andrewrutherfoord_fed-bill-poc_csp-mock_internal_db.BillingAccount'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List all billing accounts for the authenticated customer
      tags:
      - billing-accounts
    post:
      consumes:
      - application/json
      parameters:
      - description: Billing account details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.createBillingAccountRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_andrewrutherfoord_fed-bill-poc_csp-mock_internal_db.BillingAccount'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create a new billing account for the authenticated customer
      tags:
      - billing-accounts
  /billing-accounts/{account_id}:
    get:
      parameters:
      - description: Billing account ID
        in: path
        name: account_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_andrewrutherfoord_fed-bill-poc_csp-mock_internal_db.BillingAccount'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get a billing account by account ID
      tags:
      - billing-accounts
  /billing/accounts:
    post:
      consumes:
      - application/json
      description: Called by the customer-billing service. Creates a pending onboarding
        session and returns a redirect URL for the customer to complete setup.
      parameters:
      - description: Registration request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/cloudserviceprovider.RegisterLinkedCloudProviderRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/cloudserviceprovider.RegisterLinkedCloudProviderResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Initiate a CSP billing account onboarding session
      tags:
      - billing-accounts
  /billing/accounts/records:
    post:
      consumes:
      - application/json
      description: Called directly by the customer-billing service to independently
        verify what this CSP reported, without going through the billing provider.
      parameters:
      - description: Request body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/cloudserviceprovider.GetBillingAccountRecordsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/cloudserviceprovider.GetBillingAccountRecordsResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get charge batches (including raw FOCUS line items) for a billing account
      tags:
      - billing
  /customer:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_andrewrutherfoord_fed-bill-poc_csp-mock_internal_db.Customer'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get the authenticated customer
      tags:
      - customer
  /customer/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: Customer details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.registerCustomerRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_andrewrutherfoord_fed-bill-poc_csp-mock_internal_db.Customer'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register a new customer
      tags:
      - customer
  /health:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Health check
      tags:
      - health
  /onboarding/{session_id}:
    get:
      parameters:
      - description: Onboarding session ID
        in: path
        name: session_id
        required: true
        type: string
      produces:
      - text/html
      responses:
        "200":
          description: OK
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Render the CSP account onboarding form
      tags:
      - onboarding
    post:
      consumes:
      - application/x-www-form-urlencoded
      parameters:
      - description: Onboarding session ID
        in: path
        name: session_id
        required: true
        type: string
      responses:
        "303":
          description: See Other
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Submit the CSP account onboarding form
      tags:
      - onboarding
  /resource-types:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_andrewrutherfoord_fed-bill-poc_csp-mock_internal_config.ResourceType'
            type: array
      summary: List all resource types offered by this CSP
      tags:
      - catalog
  /resource-types/{id}:
    get:
      parameters:
      - description: Resource type ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_andrewrutherfoord_fed-bill-poc_csp-mock_internal_config.ResourceType'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get a resource type by ID
      tags:
      - catalog
  /resources:
    get:
      parameters:
      - description: Limit the number of results returned
        in: query
        name: limit
        type: integer
      - description: Offset for pagination
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_andrewrutherfoord_fed-bill-poc_csp-mock_internal_db.Resource'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List all resources for the authenticated customer
      tags:
      - resources
    post:
      consumes:
      - application/json
      parameters:
      - description: Resource details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.createResourceRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_andrewrutherfoord_fed-bill-poc_csp-mock_internal_db.Resource'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
