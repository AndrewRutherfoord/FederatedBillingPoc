      batch_signature:
        type: string
      billed_currency:
        type: string
      billing_account_id:
        type: string
      billing_provider_id:
        type: string
      cloud_service_provider_id:
        type: string
      created_at:
        type: string
      line_item_count:
        type: integer
      line_items:
        items:
          $ref: '#/definitions/models.FocusLineItem'
        type: array
      merkle_root:
        type: string
      total_billed_cost:
