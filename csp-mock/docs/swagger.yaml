        type: string
      invoice_issuer_name:
        type: string
      list_cost:
        type: number
      list_unit_price:
        description: Optional Fields - Pricing
        type: number
      pricing_category:
        type: string
      pricing_currency:
        type: string
      pricing_currency_contracted_unit_price:
        type: number
      pricing_currency_effective_cost:
        type: number
      pricing_currency_list_unit_price:
        type: number
      pricing_quantity:
        type: number
      pricing_unit:
        type: string
      region_id:
        type: string
      region_name:
        type: string
      resource_id:
        description: Optional Fields - Resource
        type: string
      resource_name:
        type: string
      resource_type:
        type: string
      service_category:
