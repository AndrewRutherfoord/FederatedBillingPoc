      allocated_resource_name:
        type: string
      allocated_tags:
        type: string
      availability_zone:
        description: Optional Fields - Location
        type: string
      billed_cost:
        description: Required Fields
        type: number
      billing_account_id:
        type: string
      billing_account_name:
        description: Optional Fields - Billing Account
        type: string
      billing_account_type:
        type: string
      billing_currency:
        type: string
      billing_period_end:
        type: string
      billing_period_start:
        type: string
      capacity_reservation_id:
