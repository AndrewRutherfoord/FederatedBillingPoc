host: localhost:8080
info:
  contact:
    name: Andrew Rutherfoord
  description: Mock Cloud Service Provider customer billing API implementing the FOCUS
    spec.
  title: CSP Mock Customer API
  version: "1.0"
paths:
  /billing-accounts:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_andrewrutherfoord_fed-bill-poc_csp-mock_internal_db.BillingAccount'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List all billing accounts for the authenticated customer
      tags:
      - billing-accounts
    post:
      consumes:
      - application/json
      parameters:
      - description: Billing account details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.createBillingAccountRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_andrewrutherfoord_fed-bill-poc_csp-mock_internal_db.BillingAccount'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create a new billing account for the authenticated customer
      tags:
      - billing-accounts
  /billing-accounts/{account_id}:
    get:
      parameters:
      - description: Billing account ID
        in: path
        name: account_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_andrewrutherfoord_fed-bill-poc_csp-mock_internal_db.BillingAccount'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get a billing account by account ID
      tags:
      - billing-accounts
  /customer:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_andrewrutherfoord_fed-bill-poc_csp-mock_internal_db.Customer'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get the authenticated customer
      tags:
      - customer
  /customer/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: Customer details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.registerCustomerRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_andrewrutherfoord_fed-bill-poc_csp-mock_internal_db.Customer'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register a new customer
      tags:
      - customer
  /health:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Health check
      tags:
      - health
  /resource-types:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_andrewrutherfoord_fed-bill-poc_csp-mock_internal_config.ResourceType'
            type: array
      summary: List all resource types offered by this CSP
      tags:
      - catalog
  /resource-types/{id}:
    get:
      parameters:
      - description: Resource type ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_andrewrutherfoord_fed-bill-poc_csp-mock_internal_config.ResourceType'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get a resource type by ID
      tags:
      - catalog
  /resources:
    get:
      parameters:
      - description: Limit the number of results returned
        in: query
        name: limit
        type: integer
      - description: Offset for pagination
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_andrewrutherfoord_fed-bill-poc_csp-mock_internal_db.Resource'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List all resources for the authenticated customer
      tags:
      - resources
    post:
      consumes:
      - application/json
      parameters:
      - description: Resource details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.createResourceRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_andrewrutherfoord_fed-bill-poc_csp-mock_internal_db.Resource'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Provision a new resource for the authenticated customer
      tags:
      - resources
  /resources/{id}:
    delete:
      parameters:
      - description: Resource ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete a resource by ID
      tags:
      - resources
  /resources/{id}/storage:
    put:
      consumes:
      - application/json
      parameters:
      - description: Resource ID
        in: path
        name: id
        required: true
        type: string
      - description: Storage details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.setStorageRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update the storage GB for a resource
      tags:
      - resources
securityDefinitions:
  BearerAuth:
    description: Bearer <account_id>
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
