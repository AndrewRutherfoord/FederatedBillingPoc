<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{.ProviderName}} — Link Billing Account</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f5f5f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .card { background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.1); padding: 2rem; width: 100%; max-width: 440px; }
    .provider { font-size: .75rem; font-weight: 600; letter-spacing: .05em; color: #6366f1; text-transform: uppercase; margin-bottom: .5rem; }
    h1 { font-size: 1.25rem; margin-bottom: .5rem; color: #111; }
    p.subtitle { font-size: .875rem; color: #6b7280; margin-bottom: 1.5rem; }
    .tabs { display: flex; gap: .5rem; margin-bottom: 1.5rem; }
    .tab { flex: 1; padding: .5rem; border: 1px solid #e5e7eb; border-radius: 6px; background: #f9fafb; font-size: .875rem; cursor: pointer; text-align: center; color: #374151; }
    .tab.active { background: #eef2ff; border-color: #6366f1; color: #4f46e5; font-weight: 600; }
    label { display: block; font-size: .875rem; font-weight: 500; margin-bottom: .25rem; color: #333; }
    input[type=text], input[type=email] { width: 100%; padding: .5rem .75rem; border: 1px solid #d1d5db; border-radius: 4px; font-size: 1rem; margin-bottom: 1rem; }
    input:focus { outline: 2px solid #6366f1; border-color: transparent; }
    button[type=submit] { width: 100%; padding: .625rem; background: #4f46e5; color: #fff; border: none; border-radius: 4px; font-size: 1rem; cursor: pointer; margin-top: .5rem; }
    button[type=submit]:hover { background: #4338ca; }
    .error { color: #dc2626; font-size: .875rem; margin-bottom: 1rem; padding: .5rem .75rem; background: #fef2f2; border-radius: 4px; }
    .hint { font-size: .8rem; color: #9ca3af; margin-top: -.75rem; margin-bottom: 1rem; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <p class="provider">{{.ProviderName}}</p>
    <h1>Link your billing account</h1>
    <p class="subtitle">Create a new {{.ProviderName}} account or use an existing one to link billing account <strong>{{.BillingAccountID}}</strong>.</p>

    {{if .Error}}<p class="error">{{.Error}}</p>{{end}}

    <div class="tabs">
      <button type="button" class="tab {{if eq .Mode "new"}}active{{end}}" onclick="setMode('new')">New account</button>
      <button type="button" class="tab {{if eq .Mode "existing"}}active{{end}}" onclick="setMode('existing')">Existing account</button>
    </div>

    <form method="POST" action="/onboarding/{{.SessionID}}" id="form">
      <input type="hidden" name="mode" id="mode-input" value="{{.Mode}}" />

      <div id="new-fields" class="{{if eq .Mode "existing"}}hidden{{end}}">
        <label for="name">Full name</label>
        <input id="name" type="text" name="name" value="{{.Name}}" autocomplete="name" />
        <label for="email">Email address</label>
        <input id="email" type="email" name="email" value="{{.Email}}" autocomplete="email" />
      </div>

      <div id="existing-fields" class="{{if eq .Mode "new"}}hidden{{end}}">
        <label for="customer_id">Your {{.ProviderName}} Customer ID</label>
        <input id="customer_id" type="text" name="customer_id" value="{{.CustomerID}}" autocomplete="off" />
        <p class="hint">This is the ID you received when you registered with {{.ProviderName}}.</p>
      </div>

      <button type="submit">Link account</button>
    </form>
  </div>

  <script>
    function setMode(mode) {
      document.getElementById('mode-input').value = mode;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      event.currentTarget.classList.add('active');
      document.getElementById('new-fields').classList.toggle('hidden', mode !== 'new');
      document.getElementById('existing-fields').classList.toggle('hidden', mode !== 'existing');
    }
  </script>
</body>
</html>
