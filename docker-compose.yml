
services:
  time-server:
    build:
      context: ./time-server
      dockerfile: Dockerfile
    container_name: mock-clock
    network_mode: host
    volumes:
      - ./time-server/time-state.json:/root/time-state.json

  cloud-service-provider-customer-api:
    build:
      context: .
      dockerfile: csp-mock/Dockerfile.dev
      target: customer-api
    container_name: csp-mock-customer-api
    network_mode: host
    volumes:
      - ./csp-mock:/app
      - ./keys:/keys
      - ./shared:/shared
      - ./dbs:/dbs
      - csp-mock-tmp:/app/tmp
    environment:
      - CGO_ENABLED=1
      - DB_PATH=/dbs/csp-mock.sqlite
      - MOCK_CLOCK_HOST=http://localhost:9999
    depends_on:
      - time-server

  cloud-service-provider-billing-provider-interface:
    build:
      context: .
      dockerfile: csp-mock/Dockerfile.dev
      target: billing-provider-interface
    network_mode: host
    volumes:
      - ./csp-mock:/app
      - ./keys:/keys
      - ./shared:/shared
      - ./dbs:/dbs
      - csp-mock-billing-tmp:/app/tmp
    environment:
      - CGO_ENABLED=1
      - MOCK_CLOCK_HOST=http://localhost:9999
      - DB_PATH=/dbs/csp-mock.sqlite
    depends_on:
      - time-server

  billing-provider-csp-api:
    build:
      context: .
      dockerfile: billing-provider/Dockerfile.dev
      target: cloud-service-provider-api
    network_mode: host
    volumes:
      - ./billing-provider:/app
      - ./keys:/keys
      - ./shared:/shared
      - ./dbs:/dbs
      - billing-provider-csp-tmp:/app/tmp
    environment:
      - CGO_ENABLED=1
      - MOCK_CLOCK_HOST=http://localhost:9999
      - DB_PATH=/dbs/billing-provider.sqlite
    depends_on:
      - time-server

  billing-provider-customer-api:
    build:
      context: .
      dockerfile: billing-provider/Dockerfile.dev
      target: customer-api
    network_mode: host
    volumes:
      - ./billing-provider:/app
      - ./keys:/keys
      - ./shared:/shared
      - ./dbs:/dbs
      - billing-provider-customer-tmp:/app/tmp
    environment:
      - CGO_ENABLED=1
      - MOCK_CLOCK_HOST=http://localhost:9999
      - DB_PATH=/dbs/billing-provider.sqlite
    depends_on:
      - time-server

  customer-billing-api:
    build:
      context: .
      dockerfile: customer-billing/Dockerfile.dev
      target: customer-api
    network_mode: host
    volumes:
      - ./customer-billing:/app
      - ./dbs:/dbs
      - ./shared:/shared
      - customer-billing-tmp:/app/tmp
    environment:
      - API_PORT=8082
      - MOCK_CLOCK_HOST=http://localhost:9999
      - DB_PATH=/dbs/customer-billing.sqlite
    depends_on:
      - time-server

volumes:
  csp-mock-tmp:
  csp-mock-billing-tmp:
  billing-provider-csp-tmp:
  billing-provider-customer-tmp:
  customer-billing-tmp:
