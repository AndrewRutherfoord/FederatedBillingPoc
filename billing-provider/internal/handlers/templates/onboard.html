<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Account Onboarding</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f5f5f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .card { background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.1); padding: 2rem; width: 100%; max-width: 420px; }
    h1 { font-size: 1.25rem; margin-bottom: 1.5rem; color: #111; }
    label { display: block; font-size: .875rem; font-weight: 500; margin-bottom: .25rem; color: #333; }
    input[type=text], input[type=email], select { width: 100%; padding: .5rem .75rem; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; margin-bottom: 1rem; }
    input:focus, select:focus { outline: 2px solid #4f46e5; border-color: transparent; }
    button { width: 100%; padding: .625rem; background: #4f46e5; color: #fff; border: none; border-radius: 4px; font-size: 1rem; cursor: pointer; }
    button:hover { background: #4338ca; }
    .error { color: #dc2626; font-size: .875rem; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Complete your billing account setup</h1>
    {{if .Error}}<p class="error">{{.Error}}</p>{{end}}
    <form method="POST" action="/billing/accounts/{{.AccountID}}/onboard">
      <input type="hidden" name="return_url" value="{{.ReturnURL}}" />
      <label for="name">Full name</label>
      <input id="name" type="text" name="name" value="{{.Name}}" required />
      <label for="email">Email address</label>
      <input id="email" type="email" name="email" value="{{.Email}}" required />
      <label for="billing_cycle">Billing period</label>
      <select id="billing_cycle" name="billing_cycle" required>
        <option value="weekly" {{if eq .BillingCycle "weekly"}}selected{{end}}>Weekly</option>
        <option value="monthly" {{if eq .BillingCycle "monthly"}}selected{{end}}>Monthly</option>
        <option value="quarterly" {{if eq .BillingCycle "quarterly"}}selected{{end}}>Quarterly</option>
        <option value="annual" {{if eq .BillingCycle "annual"}}selected{{end}}>Annual</option>
      </select>
      <button type="submit">Complete setup</button>
    </form>
  </div>
</body>
</html>
